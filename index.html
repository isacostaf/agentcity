<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sala dos Robôs</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#0a0c10; overflow:hidden; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  #wrap { position:relative; width:100%; height:100vh; }
  canvas { display:block; width:100%; height:100%; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:#0a0c10; color:#9fb3c8; letter-spacing:2px; font-size:12px; text-transform:uppercase; z-index:10; transition:opacity .8s ease; }
  #loading .spin { width:26px; height:26px; border-radius:50%; border:2px solid rgba(159,179,200,0.2); border-top-color:#7fd8ff; animation:sp 0.9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg);} }
  #caption { position:absolute; left:22px; bottom:20px; color:rgba(255,255,255,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase; z-index:5; font-weight:500; pointer-events:none; text-shadow:0 1px 4px rgba(0,0,0,0.6); opacity:0; transition:opacity 1.5s ease; }
  #caption b { color:rgba(255,255,255,0.85); }
  #vignette { position:absolute; inset:0; pointer-events:none; z-index:4; box-shadow: inset 0 0 180px 40px rgba(0,0,0,0.55); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="vignette"></div>
  <div id="caption">Escritório <b>Setor 4</b> — visão do supervisor</div>
  <div id="loading"><div class="spin"></div><div>carregando a sala</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputEncoding = THREE.sRGBEncoding;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070a);
scene.fog = new THREE.Fog(0x05070a, 14, 34);

var camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
var CAM_BASE_POS = [0, 3.15, 7.9];
var CAM_BASE_LOOK = [0, 1.2, -0.5];
camera.position.set(CAM_BASE_POS[0], CAM_BASE_POS[1], CAM_BASE_POS[2]);
camera.lookAt(CAM_BASE_LOOK[0], CAM_BASE_LOOK[1], CAM_BASE_LOOK[2]);

/* ---------- helpers ---------- */
function makeCanvasTexture(draw, w, h){
  var cv = document.createElement('canvas'); cv.width = w||256; cv.height = h||256;
  var ctx = cv.getContext('2d');
  draw(ctx, cv.width, cv.height);
  var tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return { canvas:cv, ctx:ctx, texture:tex };
}

/* floor texture: subtle polished tile */
var floorTex = makeCanvasTexture(function(ctx,w,h){
  ctx.fillStyle = '#12151b'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = 'rgba(255,255,255,0.035)'; ctx.lineWidth = 2;
  var step = w/8;
  for (var i=0;i<=8;i++){
    ctx.beginPath(); ctx.moveTo(i*step,0); ctx.lineTo(i*step,h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*step); ctx.lineTo(w,i*step); ctx.stroke();
  }
}, 512,512);
floorTex.texture.wrapS = floorTex.texture.wrapT = THREE.RepeatWrapping;
floorTex.texture.repeat.set(6,5);

/* window skyline texture */
var skyTex = makeCanvasTexture(function(ctx,w,h){
  var g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0c1626'); g.addColorStop(0.55,'#1c3350'); g.addColorStop(1,'#3a5878');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  for (var i=0;i<26;i++){
    var bw = 14 + Math.random()*30;
    var bh = 60 + Math.random()*180;
    var bx = Math.random()*w;
    ctx.fillStyle = 'rgba(6,10,18,0.85)';
    ctx.fillRect(bx, h-bh, bw, bh);
    var wins = Math.floor(bh/14);
    for (var j=0;j<wins;j++){
      if (Math.random() > 0.45){
        ctx.fillStyle = Math.random()>0.5 ? 'rgba(255,206,138,0.85)' : 'rgba(140,210,255,0.65)';
        ctx.fillRect(bx+4, h-bh+6+j*14, bw-8, 5);
      }
    }
  }
}, 512, 320);

/* "zzz" sleep icon, used by the 'sleepingmode' robot mode */
var zzzTex = makeCanvasTexture(function(ctx,w,h){
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(222,236,255,0.95)';
  ctx.save(); ctx.translate(w*0.24,h*0.8); ctx.rotate(-0.2); ctx.font = 'bold 30px sans-serif'; ctx.fillText('z',0,0); ctx.restore();
  ctx.save(); ctx.translate(w*0.53,h*0.52); ctx.rotate(-0.2); ctx.font = 'bold 44px sans-serif'; ctx.fillText('z',0,0); ctx.restore();
  ctx.save(); ctx.translate(w*0.8,h*0.22); ctx.rotate(-0.2); ctx.font = 'bold 58px sans-serif'; ctx.fillText('z',0,0); ctx.restore();
}, 160, 160);

/* ---------- materials ---------- */
var matWall = new THREE.MeshStandardMaterial({ color:0x252a34, roughness:0.85, metalness:0.05 });
var matWallDark = new THREE.MeshStandardMaterial({ color:0x1b2028, roughness:0.9, metalness:0.05 });
var matFloor = new THREE.MeshStandardMaterial({ map:floorTex.texture, color:0xffffff, roughness:0.35, metalness:0.25 });
var matCeil = new THREE.MeshStandardMaterial({ color:0x14171d, roughness:0.95, metalness:0.0 });
var matBody = new THREE.MeshStandardMaterial({ color:0xe9ecf1, roughness:0.32, metalness:0.18 });
var matJoint = new THREE.MeshStandardMaterial({ color:0x33373f, roughness:0.45, metalness:0.5 });
var matVisor = new THREE.MeshStandardMaterial({ color:0x0d0f13, roughness:0.2, metalness:0.3 });
var matDesk = new THREE.MeshStandardMaterial({ color:0x3a3226, roughness:0.4, metalness:0.1 });
var matDeskLeg = new THREE.MeshStandardMaterial({ color:0x1d1f24, roughness:0.4, metalness:0.7 });
var matChair = new THREE.MeshStandardMaterial({ color:0x20242c, roughness:0.55, metalness:0.2 });
var matKeyboard = new THREE.MeshStandardMaterial({ color:0x14161b, roughness:0.5, metalness:0.3 });
var matPlantPot = new THREE.MeshStandardMaterial({ color:0x3d3a34, roughness:0.7, metalness:0.1 });
var matLeaf = new THREE.MeshStandardMaterial({ color:0x3f7d4a, roughness:0.6, metalness:0.0 });
var matCup = new THREE.MeshStandardMaterial({ color:0xf5f1e8, roughness:0.3, metalness:0.05 });
var matCoffee = new THREE.MeshStandardMaterial({ color:0x3b2417, roughness:0.4, metalness:0.0 });
var matSpill = new THREE.MeshStandardMaterial({ color:0x2a1810, roughness:0.2, metalness:0.05, transparent:true, opacity:0.85 });
var matPlatformRim = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xffffff, emissiveIntensity:1.8, roughness:0.4 });

/* ---------- room ---------- */
var ROOM_W = 15, ROOM_D_BACK = 6.4, ROOM_H = 5.2;
var room = new THREE.Group();
scene.add(room);

var floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, 16), matFloor);
floor.rotation.x = -Math.PI/2; floor.position.set(0,0,3); floor.receiveShadow = true;
room.add(floor);

var ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, 16), matCeil);
ceiling.rotation.x = Math.PI/2; ceiling.position.set(0, ROOM_H, 3);
room.add(ceiling);

var backWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_H), matWall);
backWall.position.set(0, ROOM_H/2, -ROOM_D_BACK); backWall.receiveShadow = true;
room.add(backWall);

var leftWall = new THREE.Mesh(new THREE.PlaneGeometry(16, ROOM_H), matWallDark);
leftWall.rotation.y = Math.PI/2; leftWall.position.set(-ROOM_W/2, ROOM_H/2, 3); leftWall.receiveShadow = true;
room.add(leftWall);

var rightWall = new THREE.Mesh(new THREE.PlaneGeometry(16, ROOM_H), matWallDark);
rightWall.rotation.y = -Math.PI/2; rightWall.position.set(ROOM_W/2, ROOM_H/2, 3); rightWall.receiveShadow = true;
room.add(rightWall);

/* window on back wall */
var winMat = new THREE.MeshBasicMaterial({ map:skyTex.texture });
var windowMesh = new THREE.Mesh(new THREE.PlaneGeometry(12.96, 3.51), winMat);
windowMesh.position.set(0, 2.85, -ROOM_D_BACK + 0.03);
room.add(windowMesh);
var winFrame = new THREE.Mesh(new THREE.PlaneGeometry(13.365, 3.915), new THREE.MeshStandardMaterial({color:0x0c0e12, roughness:0.6}));
winFrame.position.set(0, 2.85, -ROOM_D_BACK + 0.01);
room.add(winFrame);
var winGlow = new THREE.PointLight(0x5f86b3, 2.2, 9, 2);
winGlow.position.set(0, 3, -ROOM_D_BACK + 1.6);
room.add(winGlow);

/* ceiling light strips */
var ceilLightMat = new THREE.MeshStandardMaterial({ color:0xdfeeff, emissive:0xbfd8ff, emissiveIntensity:1.6, roughness:0.4 });
[-4.6,-1.6,1.6,4.6].forEach(function(x, i){
  var strip = new THREE.Mesh(new THREE.BoxGeometry(2.6,0.06,0.35), ceilLightMat);
  strip.position.set(x, ROOM_H-0.05, 0.5);
  room.add(strip);
  if (i % 2 === 1){ /* only half the strips get a real light; the rest just glow via emissive material */
    var pl = new THREE.PointLight(0xcfe4ff, 1.3, 10, 2);
    pl.position.set(x, ROOM_H-0.5, 0.5);
    room.add(pl);
  }
});

/* ambient fill */
scene.add(new THREE.HemisphereLight(0x9fb8d8, 0x14161c, 0.55));
var sun = new THREE.DirectionalLight(0xdfe9ff, 0.6);
sun.position.set(-6, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
sun.shadow.camera.far = 24; sun.shadow.bias = -0.0015;
scene.add(sun);

/* floating dust particles */
(function(){
  var n = 140, geo = new THREE.BufferGeometry();
  var pos = new Float32Array(n*3);
  for (var i=0;i<n;i++){
    pos[i*3] = (Math.random()-0.5)*ROOM_W*0.9;
    pos[i*3+1] = Math.random()*ROOM_H;
    pos[i*3+2] = -5 + Math.random()*10;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  var mat = new THREE.PointsMaterial({ color:0xbcd4ff, size:0.02, transparent:true, opacity:0.35 });
  var pts = new THREE.Points(geo, mat);
  scene.add(pts);
  window.__dust = pts;
})();

/* ---------- coffee cup (saucer + body + handle) ---------- */
function buildCup(){
  var saucer = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.1,0.014,20), matCup);
  saucer.castShadow = true; saucer.receiveShadow = true;

  var g = new THREE.Group(); // agora só a xícara em si
  var body = new THREE.Mesh(new THREE.CylinderGeometry(0.072,0.058,0.09,20), matCup);
  body.position.y = 0.014/2 + 0.09/2;
  body.castShadow = true;
  g.add(body);
  var coffee = new THREE.Mesh(new THREE.CircleGeometry(0.066,20), matCoffee);
  coffee.rotation.x = -Math.PI/2;
  coffee.position.y = 0.014/2 + 0.09 - 0.004;
  g.add(coffee);
  var handle = new THREE.Mesh(new THREE.TorusGeometry(0.034,0.01,8,16,Math.PI*1.4), matCup);
  handle.rotation.z = Math.PI/2; handle.rotation.y = Math.PI/2;
  handle.position.set(0.09, 0.014/2 + 0.09/2, 0);
  handle.castShadow = true;
  g.add(handle);

  return { saucer: saucer, cup: g };
}

/* ---------- desk + chair + robot factory ---------- */
function buildDesk(mirrorCup){
  var g = new THREE.Group();
  var top = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.06, 0.95), matDesk);
  top.position.y = 0.75; top.castShadow = true; top.receiveShadow = true;
  g.add(top);
  [[-0.85,-0.35],[0.85,-0.35],[-0.85,0.35],[0.85,0.35]].forEach(function(p){
    var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.75,8), matDeskLeg);
    leg.position.set(p[0], 0.375, p[1]); leg.castShadow = true;
    g.add(leg);
  });
  /* monitor */
  var monStand = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,0.28,10), matJoint);
  monStand.position.set(0, 0.92, -0.28);
  g.add(monStand);
  var monBase = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.02,16), matJoint);
  monBase.position.set(0, 0.79, -0.28);
  g.add(monBase);
  var screenGroup = new THREE.Group();
  screenGroup.position.set(0, 1.14, -0.3);
  var bezel = new THREE.Mesh(new THREE.BoxGeometry(0.72,0.44,0.03), new THREE.MeshStandardMaterial({color:0x101115, roughness:0.4, metalness:0.3}));
  screenGroup.add(bezel);
  var screenTex = makeCanvasTexture(function(){}, 256,160);
  var screenMat = new THREE.MeshStandardMaterial({ map:screenTex.texture, emissiveMap:screenTex.texture, emissive:0xffffff, emissiveIntensity:1.0, roughness:0.3, side:THREE.DoubleSide });
  var screen = new THREE.Mesh(new THREE.PlaneGeometry(0.66,0.38), screenMat);
  screen.position.z = 0.018;
  screenGroup.add(screen);
  g.add(screenGroup);
  /* keyboard + mouse */
  var kb = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.02,0.18), matKeyboard);
  kb.position.set(0,0.79,0.22); kb.castShadow = true;
  g.add(kb);
  var mouse = new THREE.Mesh(new THREE.BoxGeometry(0.07,0.02,0.1), matKeyboard);
  mouse.position.set(0.34,0.79,0.24);
  g.add(mouse);
  /* coffee cup */
    var cupParts = buildCup();
    var cupX = mirrorCup ? 0.72 : -0.72;
    cupParts.saucer.position.set(cupX, 0.78, 0.3);   // fica preso na mesa
    g.add(cupParts.saucer);
    cupParts.cup.position.set(cupX, 0.78, 0.3);       // essa é a que anima
    g.add(cupParts.cup);

  /* coffee spill decor for the 'errormode' mode — hidden until then.
     Drips off the side of the desk (same side as the cup) rather than the robot-facing
     edge, so the floor puddle lands in open space instead of under the robot/chair. */
  var edgeSign = mirrorCup ? 1 : -1;
  var edgeX = edgeSign * 1.0;
  var deskStain = new THREE.Mesh(new THREE.CircleGeometry(0.16, 20), matSpill);
  deskStain.rotation.x = -Math.PI/2;
  deskStain.position.set(cupX + edgeSign*0.12, 0.781, 0.32);
  deskStain.visible = false;
  g.add(deskStain);

  var deskDrip = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.05), matSpill);
  deskDrip.position.set(edgeX, 0.74, 0.32);
  deskDrip.rotation.y = Math.PI/2;
  deskDrip.rotation.x = -1.15 * edgeSign; /* angled down over the desk's side edge */
  deskDrip.visible = false;
  g.add(deskDrip);

  return { group:g, cup:cupParts.cup, deskStain:deskStain, deskDrip:deskDrip, redrawScreen:function(t, seed){
    var ctx = screenTex.ctx, w = screenTex.canvas.width, h = screenTex.canvas.height;
    ctx.fillStyle = '#081018'; ctx.fillRect(0,0,w,h);
    var lines = 11;
    for (var i=0;i<lines;i++){
      var lw = 30 + ((Math.sin(seed*3+i*1.7+t*0.6)+1)/2) * (w-70);
      ctx.fillStyle = i % 4 === 0 ? 'rgba(120,200,255,0.85)' : 'rgba(140,220,170,0.55)';
      ctx.fillRect(14, 10 + i*13, lw, 5);
    }
    screenTex.texture.needsUpdate = true;
  }};
}

function buildChair(){
  var g = new THREE.Group();
  var seat = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.06,16), matChair);
  seat.position.y = 0.5; seat.castShadow = true;
  g.add(seat);
  var back = new THREE.Mesh(new THREE.BoxGeometry(0.44,0.5,0.06), matChair);
  back.position.set(0,0.78,-0.24); back.castShadow = true;
  g.add(back);
  var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.42,10), matJoint);
  pole.position.y = 0.28;
  g.add(pole);
  var base = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.28,0.04,16), matJoint);
  base.position.y = 0.06;
  g.add(base);
  return g;
}

function buildRobot(accent, phase){
  var accentMat = new THREE.MeshStandardMaterial({ color:accent, emissive:accent, emissiveIntensity:1.1, roughness:0.35, metalness:0.1 });
  var g = new THREE.Group();

  var hips = new THREE.Group(); hips.position.y = 0.85; g.add(hips);
  var torso = new THREE.Mesh(new THREE.SphereGeometry(0.24,20,16), matBody);
  torso.scale.set(1,1.25,0.72); torso.position.y = 0.28; torso.castShadow = true;
  hips.add(torso);
  var chestLight = new THREE.Mesh(new THREE.CircleGeometry(0.055,20), accentMat);
  chestLight.position.set(0,0.34,0.175);
  hips.add(chestLight);

  var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,0.09,10), matJoint);
  neck.position.y = 0.55;
  hips.add(neck);

  var headPivot = new THREE.Group(); headPivot.position.y = 0.66; hips.add(headPivot);
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.165,20,16), matBody);
  head.scale.set(1,0.96,0.92); head.castShadow = true;
  headPivot.add(head);
  var visor = new THREE.Mesh(new THREE.SphereGeometry(0.12,16,12,0,Math.PI*2,0,Math.PI*0.55), matVisor);
  visor.position.set(0,0.02,0.09); visor.rotation.x = 0.15;
  headPivot.add(visor);
  [-0.05,0.05].forEach(function(x){
    var eye = new THREE.Mesh(new THREE.CircleGeometry(0.028,14), accentMat);
    eye.position.set(x, 0.02, 0.175);
    headPivot.add(eye);
  });
  var antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.14,6), matJoint);
  antenna.position.set(0,0.19,0);
  headPivot.add(antenna);
  var antTip = new THREE.Mesh(new THREE.SphereGeometry(0.02,10,8), accentMat);
  antTip.position.set(0,0.26,0);
  headPivot.add(antTip);

  function buildArm(side){
    var shoulder = new THREE.Group();
    shoulder.position.set(0.26*side, 0.42, 0);
    var shoulderBall = new THREE.Mesh(new THREE.SphereGeometry(0.06,12,10), matJoint);
    shoulder.add(shoulderBall);
    var upper = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.04,0.24,10), matBody);
    upper.position.set(0,-0.12,0); upper.castShadow = true;
    shoulder.add(upper);
    var elbow = new THREE.Group(); elbow.position.set(0,-0.24,0);
    var elbowBall = new THREE.Mesh(new THREE.SphereGeometry(0.045,10,8), matJoint);
    elbow.add(elbowBall);
    var fore = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.032,0.26,10), matBody);
    fore.rotation.x = -0.95; fore.position.set(0,-0.09,0.11); fore.castShadow = true;
    elbow.add(fore);
    var hand = new THREE.Mesh(new THREE.SphereGeometry(0.05,10,8), matBody);
    hand.position.set(0,-0.17,0.23); hand.castShadow = true;
    elbow.add(hand);
    shoulder.add(elbow);
    hips.add(shoulder);
    shoulder.elbowGroup = elbow;
    return shoulder;
  }
  var armL = buildArm(-1);
  var armR = buildArm(1);

  /* small legs resting toward chair, mostly hidden */
  [-0.09,0.09].forEach(function(x){
    var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.3,10), matBody);
    leg.position.set(x, 0.0, 0.02); leg.castShadow = true;
    hips.add(leg);
  });


  /* "zzz" icon for the 'sleepingmode' mode — child of the top-level (unrotated) group
     so its world position can be placed directly above the head regardless of pose */
  var zzz = new THREE.Sprite(new THREE.SpriteMaterial({ map:zzzTex.texture, transparent:true, depthWrite:false, opacity:0 }));
  zzz.scale.set(0.3,0.3,1);
  zzz.visible = false;
  g.add(zzz);

  return { group:g, torso:torso, headPivot:headPivot, armL:armL, armR:armR, chestLight:chestLight, phase:phase, hips:hips, zzz:zzz };
}

    /* BREAK CORNER COFFEE*/
  function buildBreakCorner(x,z,rotY){
  var g = new THREE.Group();
  var cab = new THREE.Mesh(
    new THREE.BoxGeometry(3.2,0.8,0.55),
    new THREE.MeshStandardMaterial({color:0x0a0c11, roughness:0.5})
  );
  cab.position.y = 0.4; cab.castShadow = true; cab.receiveShadow = true;
  g.add(cab);
  [-0.32,0.32].forEach(function(dx){
    var handle = new THREE.Mesh(new THREE.BoxGeometry(0.03,0.14,0.03), matJoint);
    handle.position.set(dx,0.4,0.28);
    g.add(handle);
  });

  var seam = new THREE.Mesh(new THREE.BoxGeometry(0.01,0.78,0.56), matJoint);
  seam.position.set(0,0.4,0);
  g.add(seam);

  var top = new THREE.Mesh(
    new THREE.BoxGeometry(3.28,0.05,0.62),
    new THREE.MeshStandardMaterial({color:0x161b24, roughness:0.25})
  );
  top.position.y = 0.825; top.castShadow = true; top.receiveShadow = true;
  g.add(top);

  var splash = new THREE.Mesh(
    new THREE.BoxGeometry(3.28,0.35,0.03),
    new THREE.MeshStandardMaterial({color:0x161b24, roughness:0.4})
  );
  splash.position.set(0,1.02,-0.29);
  g.add(splash);

  var upper = new THREE.Mesh(
    new THREE.BoxGeometry(3.0,0.5,0.32),
    new THREE.MeshStandardMaterial({color:0x0a0c11, roughness:0.5})
  );
  upper.position.set(0,1.9,-0.14); upper.castShadow = true;
  g.add(upper);
  [-0.28,0.28].forEach(function(dx){
    var h2 = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.02,0.02), matJoint);
    h2.position.set(dx,1.9,0.03);
    g.add(h2);

function buildPlatform(x, z){
  var g = new THREE.Group();
  var PW = 2.8, PD = 2.3, rimT = 0.05, rimY = 0.012;

  var rimMat = matPlatformRim.clone();
  [
    { w:PW, d:rimT, x:0, z: PD/2 },
    { w:PW, d:rimT, x:0, z:-PD/2 },
    { w:rimT, d:PD, x: PW/2, z:0 },

   (robo1 = first desk, robo2 = second desk, ...).
   Available modes: 'workingmode' (typing + coffee break), 'idlemode' (idle, sitting still),

  robotObj.mode = ROBOT_MODES[i] || 'workingmode';
  /* no extra rotation: the robot's built-in forward direction now faces the camera */
  room.add(robotObj.group);

  /* coffee-drinking behaviour: pick the arm on the same side as this desk's cup */
  var drinkSide = (p[0] > 0) ? -1 : 1; /* matches mirrorCup logic in buildDesk */
  robotObj.drinkArm = (drinkSide === -1) ? robotObj.armL : robotObj.armR;
  robotObj.drinkSide = drinkSide;
  robotObj.cup = deskObj.cup;
  robotObj.deskStain = deskObj.deskStain;

  robotObj.drinkElbow = robotObj.drinkArm.elbowGroup;
  deskObj.group.updateMatrixWorld(true); /* localToWorld needs an up-to-date matrix, unlike getWorldPosition */
  robotObj.cupWorldRest = deskObj.group.localToWorld(deskObj.cup.position.clone());

/* ---------- fixed supervisor overview camera ---------- */
/* Keeps all 4 desks in frame at once, like a manager watching the room.
   Adaptive FOV recalculates on resize so the row of robots always fits,
   and a very small idle sway keeps the shot from feeling like a static photo. */
function updateFov(){
  var aspect = window.innerWidth/window.innerHeight;
  var dist = CAM_BASE_POS[2] - 2.2;      /* distance to the nearest desk row (monitors now face us) */
  var halfX = 5.1;                        /* half-width to cover (desks + robots + margin) */
  var hHalf = Math.atan(halfX/dist);
  var vHalf = Math.atan(Math.tan(hHalf)/aspect);
  var neededFov = (vHalf * 180/Math.PI) * 2;
  camera.fov = Math.min(74, Math.max(46, neededFov+5));
  camera.updateProjectionMatrix();
}
updateFov();

/* ---------- animation loop ---------- */
var clock = new THREE.Clock();
var frame = 0;
var __drinkHeadWorld = new THREE.Vector3();
var __drinkLocalTarget = new THREE.Vector3();
var __drinkHandTarget = new THREE.Vector3();
var __drinkShoulderWorld = new THREE.Vector3();
var __drinkToTarget = new THREE.Vector3();
var __drinkV2 = new THREE.Vector3();
var __drinkHandLocal = new THREE.Vector3();
var __drinkRestQuat = new THREE.Quaternion();
var __drinkAimQuat = new THREE.Quaternion();
var __xAxis = new THREE.Vector3(1,0,0);
var __zzzHeadWorld = new THREE.Vector3();

/* simple analytic 2-bone arm IK so the hand actually arrives at the cup, then at the mouth */
var IK_L1 = 0.24;
var IK_V2_0 = new THREE.Vector3(0, -0.17, 0.23);
var IK_L2 = IK_V2_0.length();
var IK_V1_DIR = new THREE.Vector3(0, -1, 0);
var IK_BASE_ANGLE = Math.acos( IK_V1_DIR.dot(IK_V2_0.clone().normalize()) );
var IK_MAX = IK_L1 + IK_L2, IK_MIN = Math.abs(IK_L1 - IK_L2);

/* aims one shoulder+elbow so the hand lands exactly on targetWorld (full snap, no blending) */
function ikAimArmAt(shoulderGroup, targetWorld){
  shoulderGroup.getWorldPosition(__drinkShoulderWorld);
  __drinkToTarget.copy(targetWorld).sub(__drinkShoulderWorld);
  var D = THREE.MathUtils.clamp(__drinkToTarget.length(), IK_MIN, IK_MAX);
  __drinkToTarget.normalize();

  var cosAngle = THREE.MathUtils.clamp((D*D - IK_L1*IK_L1 - IK_L2*IK_L2) / (2*IK_L1*IK_L2), -1, 1);
  var delta = IK_BASE_ANGLE - Math.acos(cosAngle);
  shoulderGroup.elbowGroup.rotation.x = delta;

  __drinkV2.copy(IK_V2_0).applyAxisAngle(__xAxis, delta);
  __drinkHandLocal.copy(IK_V1_DIR).multiplyScalar(IK_L1).add(__drinkV2).normalize();
  __drinkAimQuat.setFromUnitVectors(__drinkHandLocal, __drinkToTarget);
  shoulderGroup.quaternion.copy(__drinkAimQuat);
}

/* coffee-sip timeline: reach for the cup -> lift it with the cup -> hold -> lower together -> release */
var DRINK_DURATION = 3.1;
var DRINK_T1 = 0.177, DRINK_T2 = 0.387, DRINK_T3 = 0.613, DRINK_T4 = 0.823;
function smoothstep01(x){ x = x<0?0:(x>1?1:x); return x*x*(3-2*x); }
function drinkPhaseAmounts(dp){
  if (dp < DRINK_T1) return { reach: smoothstep01(dp/DRINK_T1), lift: 0 };
  if (dp < DRINK_T2) return { reach: 1, lift: smoothstep01((dp-DRINK_T1)/(DRINK_T2-DRINK_T1)) };
  if (dp < DRINK_T3) return { reach: 1, lift: 1 };
  if (dp < DRINK_T4) return { reach: 1, lift: 1 - smoothstep01((dp-DRINK_T3)/(DRINK_T4-DRINK_T3)) };
  return { reach: 1 - smoothstep01((dp-DRINK_T4)/(1-DRINK_T4)), lift: 0 };
}

   Each mode is a function(r, t): r is the robot object, t is the elapsed clock time.
   It's responsible for posing that one robot for the current frame.
   To add a new mode: write a function here, then list it in ROBOT_MODE_HANDLERS below.
   To use it: set the matching robo1..robo6 variable (near `positions`) to its name. */

var LAMP_COLOR_NORMAL = 0xffb268, LAMP_COLOR_ALERT = 0xff1111;
var LED_COLOR_NORMAL = 0xffffff, LED_COLOR_ALERT = 0xff1111, LED_COLOR_SLEEP = 0x080a0e;

function modeWorking(r, t){
  var ph = r.phase;
  r.zzz.visible = false;
  r.lamp.visible = true;
  r.lamp.color.setHex(LAMP_COLOR_NORMAL);
  r.ledMat.color.setHex(LED_COLOR_NORMAL);
  r.ledMat.emissive.setHex(LED_COLOR_NORMAL);
  r.deskStain.visible = false;
  r.deskDrip.visible = false;
  r.floorPuddle.visible = false;

  /* occasional, gentle, staggered coffee break: arm reaches the cup first, then lifts it, holds, lowers, releases */
  if (!r.drinking && t >= r.nextDrink){ r.drinking = true; r.drinkStart = t; }
  var reachAmt = 0, liftAmt = 0;
  if (r.drinking){
    var dp = (t - r.drinkStart) / DRINK_DURATION;
    if (dp >= 1){
      r.drinking = false;
      r.nextDrink = t + 16 + Math.random()*18; /* spaced out, different per robot */
    } else {
      var amt = drinkPhaseAmounts(dp);
      reachAmt = amt.reach; liftAmt = amt.lift;
    }
  }
  r.drinkT = liftAmt;

  r.hips.position.y = 0.85 + Math.sin(t*1.1+ph)*0.012;
  r.hips.position.x = r.reachLean.x * reachAmt;
  r.hips.position.z = r.reachLean.z * reachAmt;

  var typeCycle = Math.sin(t*3.4+ph)*0.16 + Math.sin(t*7.1+ph*1.3)*0.05;
  r.armL.rotation.x = -0.55 + typeCycle;
  r.armR.rotation.x = -0.55 - typeCycle*0.8;
  r.armL.rotation.z = 0;
  r.armR.rotation.z = 0;
  r.armL.elbowGroup.rotation.x = 0;
  r.armR.elbowGroup.rotation.x = 0;
  var yaw = Math.sin(t*0.16+ph)*0.28 + Math.sin(t*0.05+ph*2)*0.12;
  var pitch = -0.08 + Math.sin(t*0.9+ph)*0.02;
  r.headPivot.rotation.y = yaw;
  r.headPivot.rotation.x = pitch;
  r.chestLight.material.emissiveIntensity = 0.85 + Math.sin(t*2.2+ph)*0.4;

  if (reachAmt > 0.001){
    r.headPivot.rotation.x += 0.16 * liftAmt;
    r.headPivot.rotation.y *= (1 - 0.6*liftAmt);

    /* target the hand travels to: resting on the cup, then blending up toward the mouth */
    r.headPivot.getWorldPosition(__drinkHeadWorld);
    __drinkHeadWorld.y -= 0.05;
    __drinkHeadWorld.z += 0.09;
    __drinkHeadWorld.x += r.drinkSide * 0.04;
    __drinkHandTarget.copy(r.cupWorldRest).lerp(__drinkHeadWorld, liftAmt);

    /* 2-bone IK: solve elbow bend for distance, then aim the shoulder so the hand lands exactly on target */
    r.drinkArm.getWorldPosition(__drinkShoulderWorld);
    __drinkToTarget.copy(__drinkHandTarget).sub(__drinkShoulderWorld);
    var D = THREE.MathUtils.clamp(__drinkToTarget.length(), IK_MIN, IK_MAX);
    __drinkToTarget.normalize();

    var cosAngle = THREE.MathUtils.clamp((D*D - IK_L1*IK_L1 - IK_L2*IK_L2) / (2*IK_L1*IK_L2), -1, 1);
    var neededAngle = Math.acos(cosAngle);
    var delta = IK_BASE_ANGLE - neededAngle;
    r.drinkElbow.rotation.x = delta * reachAmt;

    __drinkV2.copy(IK_V2_0).applyAxisAngle(__xAxis, delta);
    __drinkHandLocal.copy(IK_V1_DIR).multiplyScalar(IK_L1).add(__drinkV2).normalize();

    __drinkRestQuat.copy(r.drinkArm.quaternion);
    __drinkAimQuat.setFromUnitVectors(__drinkHandLocal, __drinkToTarget);
    r.drinkArm.quaternion.copy(__drinkRestQuat).slerp(__drinkAimQuat, reachAmt);

    /* the cup rides exactly where the hand is heading */
    r.deskGroup.worldToLocal(__drinkLocalTarget.copy(__drinkHandTarget));
    r.cup.position.lerpVectors(r.cupBasePos, __drinkLocalTarget, liftAmt);
    r.cup.rotation.z = r.cupBaseRot.z - r.drinkSide * 0.6 * liftAmt;
    r.cup.rotation.x = r.cupBaseRot.x - 0.45 * liftAmt;
  } else {
    r.cup.position.copy(r.cupBasePos);
    r.cup.rotation.z = r.cupBaseRot.z;
    r.cup.rotation.x = r.cupBaseRot.x;
  }
}

function modeIdle(r, t){
  /* idle: sitting still at the desk, no typing, no coffee — just a faint breathing bob */
  var ph = r.phase;
  r.zzz.visible = false;
  r.lamp.visible = true;
  r.lamp.color.setHex(LAMP_COLOR_NORMAL);
  r.ledMat.color.setHex(LED_COLOR_NORMAL);
  r.ledMat.emissive.setHex(LED_COLOR_NORMAL);
  r.deskStain.visible = false;
  r.deskDrip.visible = false;
  r.floorPuddle.visible = false;
  r.hips.position.y = 0.85 + Math.sin(t*0.7+ph)*0.008;
  r.hips.position.x = 0;
  r.hips.position.z = 0;
  r.armL.rotation.set(-0.55, 0, 0);
  r.armR.rotation.set(-0.55, 0, 0);
  r.armL.elbowGroup.rotation.x = 0;
  r.armR.elbowGroup.rotation.x = 0;
  r.headPivot.rotation.set(-0.08, 0, 0);
  r.chestLight.material.emissiveIntensity = 0.85 + Math.sin(t*1.1+ph)*0.15;
  r.cup.position.copy(r.cupBasePos);
  r.cup.rotation.copy(r.cupBaseRot);
}

function modeSleeping(r, t){
  /* asleep: bowed forward at the hips until the head rests on the desk, plus a "zzz" drifting up */
  var ph = r.phase;
  r.lamp.visible = false;
  r.lamp.color.setHex(LAMP_COLOR_NORMAL);
  r.ledMat.color.setHex(LED_COLOR_SLEEP);
  r.ledMat.emissive.setHex(LED_COLOR_SLEEP);
  r.deskStain.visible = false;
  r.deskDrip.visible = false;
  r.floorPuddle.visible = false;
  var BOW = 1.42; /* radians — forward bow so the head reaches desk height */

  r.hips.rotation.x = BOW + Math.sin(t*0.5+ph)*0.012; /* tiny breathing sway */
  r.hips.position.y = 0.82 + Math.sin(t*0.5+ph)*0.005;
  r.hips.position.x = 0;
  r.hips.position.z = -0.2; /* the forward bow alone overshoots past the monitor; pull back so the head lands in the open desk space */

  r.armL.rotation.set(0,0,0);
  r.armR.rotation.set(0,0,0);
  r.armL.elbowGroup.rotation.x = 0;
  r.armR.elbowGroup.rotation.x = 0;
  r.headPivot.rotation.set(0,0,0);

  r.chestLight.material.emissiveIntensity = 0.25 + Math.sin(t*0.5+ph)*0.08; /* dim, slow pulse: power-save look */

  r.cup.position.copy(r.cupBasePos);
  r.cup.rotation.copy(r.cupBaseRot);

  /* zzz: loops upward from the head, fading in then out, resetting to start over */
  r.headPivot.getWorldPosition(__zzzHeadWorld);
  var cyc = (t*0.35 + ph*0.27) % 1;
  var rise = cyc * 1.2;
  var fade = Math.sin(cyc * Math.PI);
  r.zzz.visible = true;
  r.zzz.position.set(
    __zzzHeadWorld.x - r.group.position.x + 0.15,
    __zzzHeadWorld.y - r.group.position.y + 0.1 + rise,
    __zzzHeadWorld.z - r.group.position.z
  );
  r.zzz.material.opacity = 0.9 * fade;
  var s = 0.26 + cyc*0.14;
  r.zzz.scale.set(s, s, 1);
}

function modeError(r, t){
  /* malfunctioning: both hands clamped to the head, jittery/glitchy movement,
     red-alert lamp + floor LED, and the coffee cup knocked over with coffee
     spilled on the desk and floor */
  var ph = r.phase;
  r.zzz.visible = false;
  r.lamp.visible = true;
  r.lamp.color.setHex(LAMP_COLOR_ALERT);
  r.ledMat.color.setHex(LED_COLOR_ALERT);
  r.ledMat.emissive.setHex(LED_COLOR_ALERT);

  r.hips.rotation.x = 0;
  r.hips.position.y = 0.85 + Math.sin(t*9+ph)*0.01 + Math.sin(t*23+ph*1.7)*0.005;
  r.hips.position.x = Math.sin(t*13+ph)*0.012;
  r.hips.position.z = 0;

  /* both hands clamp onto the sides of the head, shaking — same 2-bone IK as the coffee
     reach, aimed at a point on the head instead of the cup, so the hands actually land there */
  r.headPivot.getWorldPosition(__drinkHeadWorld);
  __drinkHeadWorld.x += 0.15 + Math.sin(t*22+ph)*0.015;
  __drinkHeadWorld.y += 0.02 + Math.sin(t*17+ph)*0.01;
  __drinkHeadWorld.z += 0.06;
  ikAimArmAt(r.armR, __drinkHeadWorld);

  r.headPivot.getWorldPosition(__drinkHeadWorld);
  __drinkHeadWorld.x -= 0.15 + Math.sin(t*20+ph+1.3)*0.015;
  __drinkHeadWorld.y += 0.02 + Math.sin(t*15+ph+0.7)*0.01;
  __drinkHeadWorld.z += 0.06;
  ikAimArmAt(r.armL, __drinkHeadWorld);

  /* glitchy, shaky head */
  r.headPivot.rotation.y = Math.sin(t*15+ph)*0.35 + Math.sin(t*37+ph)*0.12;
  r.headPivot.rotation.x = -0.05 + Math.sin(t*18+ph)*0.15;

  /* flickering warning pulse instead of the calm idle glow */
  r.chestLight.material.color.set(0xff2222);
  r.chestLight.material.emissive.set(0xff0000);
  r.chestLight.material.emissiveIntensity = Math.random() > 0.35 ? 1.3 : 0.2;

  /* the cup toppled over, coffee spilled across the desk and dripping onto the floor */
  r.cup.position.set(r.cupBasePos.x + 0.05, 0.735, r.cupBasePos.z - 0.02);
  r.cup.rotation.set(0, 0, 1.65);
  r.deskStain.visible = true;
  r.deskDrip.visible = true;
  r.floorPuddle.visible = true;
}

var ROBOT_MODE_HANDLERS = {
  workingmode: modeWorking,
  idlemode: modeIdle,
  sleepingmode: modeSleeping,
  errormode: modeError
};

function animate(){
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();
  frame++;

  robots.forEach(function(r){
    var handler = ROBOT_MODE_HANDLERS[r.mode] || modeWorking;
    handler(r, t);
  });

  if (frame % 20 === 0){
    desks.forEach(function(d,i){ d.redrawScreen(t, i*1.3); });
  }

  if (window.__dust){
    window.__dust.rotation.y = t*0.01;
  }

  updateCamera(t);
  renderer.render(scene, camera);
}

/* first paint */
updateCamera(0);
renderer.render(scene, camera);
var loadingEl = document.getElementById('loading');
var captionEl = document.getElementById('caption');
setTimeout(function(){
  loadingEl.style.opacity = '0';
  captionEl.style.opacity = '1';
  setTimeout(function(){ loadingEl.style.display='none'; }, 850);
}, 420);
animate();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  updateFov();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
})();
</script>
