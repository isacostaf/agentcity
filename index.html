<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cockpit</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#0a0c10; overflow:hidden; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  #wrap { position:relative; width:100%; height:100vh; }
  canvas { display:block; width:100%; height:100%; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:#0a0c10; color:#9fb3c8; letter-spacing:2px; font-size:12px; text-transform:uppercase; z-index:10; transition:opacity .8s ease; }
  #loading .spin { width:26px; height:26px; border-radius:50%; border:2px solid rgba(159,179,200,0.2); border-top-color:#7fd8ff; animation:sp 0.9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg);} }
  #caption { position:absolute; left:22px; bottom:20px; color:rgba(255,255,255,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase; z-index:5; font-weight:500; pointer-events:none; text-shadow:0 1px 4px rgba(0,0,0,0.6); opacity:0; transition:opacity 1.5s ease; }
  #caption b { color:rgba(255,255,255,0.85); }
  #vignette { position:absolute; inset:0; pointer-events:none; z-index:4; box-shadow: inset 0 0 180px 40px rgba(0,0,0,0.55); }

  #holoTooltip {
    position:absolute; left:0; top:0; z-index:7;
    width:300px;
    pointer-events:none;
    opacity:0;
    transform:translate(-50%,0) scale(0.94);
    transform-origin:top center;
    transition:opacity .25s ease, transform .25s ease;
    font-family:'Courier New',monospace;
    color:#cfeeff;
  }
  #holoTooltip.visible { opacity:1; transform:translate(-50%,0) scale(1); }

  #holoTooltip .hpConnDot { width:6px; height:6px; margin:0 auto; border-radius:50%; background:#8fe3ff; box-shadow:0 0 8px #8fe3ff; }
  #holoTooltip .hpConnector { width:1px; height:16px; margin:0 auto; background:linear-gradient(180deg, rgba(140,220,255,0.9), rgba(140,220,255,0.1)); }

  #holoTooltip .hpFrame {
    position:relative;
    padding:18px 22px 14px;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.02) 30%, rgba(255,255,255,0.0) 55%),
      linear-gradient(160deg, rgba(10,22,34,0.24), rgba(4,10,18,0.32));
    backdrop-filter: blur(26px) saturate(170%);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    border:1px solid rgba(210,235,255,0.3);
    border-radius:26px;
    box-shadow:0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.16), inset 0 0 40px rgba(89,214,255,0.05);
    overflow:hidden;
  }
  #holoTooltip .hpFrame::before {
    content:''; position:absolute; left:0; right:0; top:-5%; height:2px;
    background:linear-gradient(90deg, transparent, rgba(150,225,255,0.85), transparent);
    animation: hpScan 2.6s linear infinite;
  }
  @keyframes hpScan { 0%{ top:-5%; } 100%{ top:105%; } }

  /* small radiating tick marks near each rounded corner, like the reference HUD */
  #holoTooltip .hpCorner { position:absolute; width:16px; height:16px; pointer-events:none; }
  #holoTooltip .hpCorner::before, #holoTooltip .hpCorner::after { content:''; position:absolute; background:#9be6ff; box-shadow:0 0 5px #9be6ff; }
  #holoTooltip .hpCorner.tl { top:7px; left:7px; }
  #holoTooltip .hpCorner.tr { top:7px; right:7px; }
  #holoTooltip .hpCorner.bl { bottom:7px; left:7px; }
  #holoTooltip .hpCorner.br { bottom:7px; right:7px; }
  #holoTooltip .hpCorner.tl::before, #holoTooltip .hpCorner.tr::before, #holoTooltip .hpCorner.bl::before, #holoTooltip .hpCorner.br::before { width:9px; height:2px; top:0; }
  #holoTooltip .hpCorner.tl::after, #holoTooltip .hpCorner.tr::after, #holoTooltip .hpCorner.bl::after, #holoTooltip .hpCorner.br::after { width:2px; height:9px; left:0; }
  #holoTooltip .hpCorner.tl::before, #holoTooltip .hpCorner.tl::after { left:0; top:0; }
  #holoTooltip .hpCorner.tr::before { right:0; left:auto; }
  #holoTooltip .hpCorner.tr::after { right:0; left:auto; top:0; }
  #holoTooltip .hpCorner.bl::before { bottom:0; top:auto; }
  #holoTooltip .hpCorner.bl::after { bottom:0; top:auto; left:0; }
  #holoTooltip .hpCorner.br::before { bottom:0; top:auto; right:0; }
  #holoTooltip .hpCorner.br::after { bottom:0; top:auto; right:0; }

  #holoTooltip .hpTop { display:flex; align-items:baseline; justify-content:space-between; }
  #holoTooltip .hpTitle { font-weight:bold; letter-spacing:2px; font-size:15px; color:#a9ecff; text-shadow:0 0 8px rgba(120,210,255,0.6); }
  #holoTooltip .hpLive { font-size:9px; letter-spacing:1px; color:#7cffa0; display:flex; align-items:center; gap:4px; }
  #holoTooltip .hpLive i { width:6px; height:6px; border-radius:50%; background:#7cffa0; box-shadow:0 0 6px #7cffa0; animation: htBlink 1.1s infinite; }
  #holoTooltip .hpSub { font-size:9px; letter-spacing:1.5px; color:rgba(170,220,255,0.55); margin-bottom:11px; }

  #holoTooltip .hpRow { margin-top:9px; }
  #holoTooltip .hpRowTop { display:flex; align-items:center; gap:7px; font-size:11px; letter-spacing:1px; margin-bottom:4px; }
  #holoTooltip .hpRowTop .htVal { margin-left:auto; font-weight:bold; color:#eaf6ff; }
  #holoTooltip .hpDot { width:7px; height:7px; border-radius:50%; box-shadow:0 0 6px currentColor; flex:none; }
  #holoTooltip .hpBarTrack { height:4px; background:rgba(140,190,220,0.15); border-radius:2px; overflow:hidden; }
  #holoTooltip .hpBarFill { height:100%; width:0%; border-radius:2px; transition:width .4s ease; box-shadow:0 0 8px currentColor; }
  #holoTooltip .hpDot.active, #holoTooltip .hpBarFill.active { background:#7ee081; color:#7ee081; }
  #holoTooltip .hpDot.error, #holoTooltip .hpBarFill.error { background:#ff5c4d; color:#ff5c4d; }
  #holoTooltip .hpDot.sleep, #holoTooltip .hpBarFill.sleep { background:#8f9dff; color:#8f9dff; }

  #holoTooltip .hpFooter { margin-top:13px; padding-top:9px; border-top:1px solid rgba(140,210,255,0.2); font-size:9px; letter-spacing:1.5px; color:rgba(170,220,255,0.6); display:flex; justify-content:space-between; }

  #holoTooltip .hpRawList { margin-top:9px; padding-top:9px; border-top:1px solid rgba(140,210,255,0.2); }
  #holoTooltip .hpRawTitle { font-size:9px; letter-spacing:1.5px; color:rgba(170,220,255,0.55); margin-bottom:6px; }
  #holoTooltip .hpRawRow { display:flex; justify-content:space-between; align-items:center; font-size:10px; letter-spacing:0.5px; padding:3px 0; }
  #holoTooltip .hpRawRow .hrName { color:rgba(200,230,255,0.75); }
  #holoTooltip .hpRawRow .hrVal { font-weight:bold; color:#eaf6ff; max-width:150px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  @keyframes htBlink { 0%,100%{opacity:1;} 50%{opacity:.25;} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="vignette"></div>
  <div id="caption">Escritório <b>DEORG SEORI SG</b> — visão do gestor</div>
  <div id="loading"><div class="spin"></div><div>carregando a sala</div></div>
  <div id="holoTooltip">
    <div class="hpConnDot"></div>
    <div class="hpConnector"></div>
    <div class="hpFrame">
      <div class="hpCorner tl"></div>
      <div class="hpCorner tr"></div>
      <div class="hpCorner bl"></div>
      <div class="hpCorner br"></div>
      <div class="hpTop">
        <span class="hpTitle">AGENTES</span>
        <span class="hpLive"><i></i>AO VIVO</span>
      </div>
      <div class="hpSub">MONITOR DE FORÇA DE TRABALHO AUTÔNOMA</div>

      <div class="hpRow">
        <div class="hpRowTop"><span class="hpDot active"></span>ATIVOS<span class="htVal" id="htActiveVal">0</span></div>
        <div class="hpBarTrack"><div class="hpBarFill active" id="htActiveBar"></div></div>
      </div>
      <div class="hpRow">
        <div class="hpRowTop"><span class="hpDot error"></span>ERRO<span class="htVal" id="htErrorVal">0</span></div>
        <div class="hpBarTrack"><div class="hpBarFill error" id="htErrorBar"></div></div>
      </div>
      <div class="hpRow">
        <div class="hpRowTop"><span class="hpDot sleep"></span>DORMINDO<span class="htVal" id="htSleepVal">0</span></div>
        <div class="hpBarTrack"><div class="hpBarFill sleep" id="htSleepBar"></div></div>
      </div>
      <div class="hpRawList" id="htRawList"></div>
      <div class="hpFooter"><span id="htTotalLabel">TOTAL: 0</span><span>SETOR 4</span></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";

var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputEncoding = THREE.sRGBEncoding;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070a);
scene.fog = new THREE.Fog(0x05070a, 14, 34);

var camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
var CAM_BASE_POS = [0, 3.15, 7.9];
var CAM_BASE_LOOK = [0, 1.2, -0.5];
camera.position.set(CAM_BASE_POS[0], CAM_BASE_POS[1], CAM_BASE_POS[2]);
camera.lookAt(CAM_BASE_LOOK[0], CAM_BASE_LOOK[1], CAM_BASE_LOOK[2]);

/* ---------- helpers ---------- */
function makeCanvasTexture(draw, w, h){
  var cv = document.createElement('canvas'); cv.width = w||256; cv.height = h||256;
  var ctx = cv.getContext('2d');
  draw(ctx, cv.width, cv.height);
  var tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return { canvas:cv, ctx:ctx, texture:tex };
}

/* floor texture: subtle polished tile */
var floorTex = makeCanvasTexture(function(ctx,w,h){
  ctx.fillStyle = '#12151b'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = 'rgba(255,255,255,0.035)'; ctx.lineWidth = 2;
  var step = w/8;
  for (var i=0;i<=8;i++){
    ctx.beginPath(); ctx.moveTo(i*step,0); ctx.lineTo(i*step,h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*step); ctx.lineTo(w,i*step); ctx.stroke();
  }
}, 512,512);
floorTex.texture.wrapS = floorTex.texture.wrapT = THREE.RepeatWrapping;
floorTex.texture.repeat.set(6,5);

/* window skyline texture */
var skyTex = makeCanvasTexture(function(ctx,w,h){
  var g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0c1626'); g.addColorStop(0.55,'#1c3350'); g.addColorStop(1,'#3a5878');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  for (var i=0;i<26;i++){
    var bw = 14 + Math.random()*30;
    var bh = 60 + Math.random()*180;
    var bx = Math.random()*w;
    ctx.fillStyle = 'rgba(6,10,18,0.85)';
    ctx.fillRect(bx, h-bh, bw, bh);
    var wins = Math.floor(bh/14);
    for (var j=0;j<wins;j++){
      if (Math.random() > 0.45){
        ctx.fillStyle = Math.random()>0.5 ? 'rgba(255,206,138,0.85)' : 'rgba(140,210,255,0.65)';
        ctx.fillRect(bx+4, h-bh+6+j*14, bw-8, 5);
      }
    }
  }
}, 512, 320);

/* "zzz" sleep icon, used by the 'sleepingmode' robot mode */
var zzzTex = makeCanvasTexture(function(ctx,w,h){
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(222,236,255,0.95)';
  ctx.save(); ctx.translate(w*0.24,h*0.8); ctx.rotate(-0.2); ctx.font = 'bold 30px sans-serif'; ctx.fillText('z',0,0); ctx.restore();
  ctx.save(); ctx.translate(w*0.53,h*0.52); ctx.rotate(-0.2); ctx.font = 'bold 44px sans-serif'; ctx.fillText('z',0,0); ctx.restore();
  ctx.save(); ctx.translate(w*0.8,h*0.22); ctx.rotate(-0.2); ctx.font = 'bold 58px sans-serif'; ctx.fillText('z',0,0); ctx.restore();
}, 160, 160);

/* small, discreet physical name tag above each robot's head — same tech/HUD styling as the hologram hover card */
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function buildNameTag(text){
  var fontSize=22, padX=16, dotR=4, gap=10, h=64;
  var measureCv = document.createElement('canvas');
  var mctx = measureCv.getContext('2d');
  mctx.font = 'bold ' + fontSize + 'px monospace';
  var textW = mctx.measureText(text).width;
  var w = Math.ceil(padX*2 + dotR*2 + gap + textW); /* card grows/shrinks with the name */

  var tagTex = makeCanvasTexture(function(ctx,cw,ch){
    var r = ch*0.32, inset=3;
    ctx.clearRect(0,0,cw,ch);

    /* soft drop shadow so the glass reads against any background */
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
    roundRectPath(ctx, inset,inset, cw-inset*2, ch-inset*2, r);
    ctx.fillStyle = 'rgba(255,255,255,0.001)'; /* shadow-only pass */
    ctx.fill();
    ctx.restore();

    /* frosted glass body */
    roundRectPath(ctx, inset,inset, cw-inset*2, ch-inset*2, r);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fill();

    /* glass sheen: brighter near the top, fading out */
    var grad = ctx.createLinearGradient(0,inset,0,ch-inset);
    grad.addColorStop(0,'rgba(255,255,255,0.30)');
    grad.addColorStop(0.55,'rgba(255,255,255,0.06)');
    grad.addColorStop(1,'rgba(255,255,255,0.0)');
    roundRectPath(ctx, inset,inset, cw-inset*2, ch-inset*2, r);
    ctx.fillStyle = grad;
    ctx.fill();

    /* thin bright edge */
    roundRectPath(ctx, inset,inset, cw-inset*2, ch-inset*2, r);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.stroke();

    /* status dot */
    ctx.fillStyle = 'rgba(140,255,180,0.95)';
    ctx.beginPath(); ctx.arc(padX+dotR, ch/2, dotR, 0, Math.PI*2); ctx.fill();

    /* name */
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = 'bold ' + fontSize + 'px monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(text, padX+dotR*2+gap, ch/2+1);
  }, w, h);

  var tagMat = new THREE.SpriteMaterial({ map:tagTex.texture, transparent:true, depthWrite:false });
  var sprite = new THREE.Sprite(tagMat);
  var worldH = 0.27; /* fixed height; width follows the canvas's own aspect ratio, i.e. the name's length */
  sprite.scale.set(worldH * (w/h), worldH, 1);
  return sprite;
}

/* ---------- materials ---------- */
var matWall = new THREE.MeshStandardMaterial({ color:0x252a34, roughness:0.85, metalness:0.05 });
var matWallDark = new THREE.MeshStandardMaterial({ color:0x1b2028, roughness:0.9, metalness:0.05 });
var matFloor = new THREE.MeshStandardMaterial({ map:floorTex.texture, color:0xffffff, roughness:0.35, metalness:0.25 });
var matCeil = new THREE.MeshStandardMaterial({ color:0x14171d, roughness:0.95, metalness:0.0 });
var matBody = new THREE.MeshStandardMaterial({ color:0xe9ecf1, roughness:0.32, metalness:0.18 });
var matJoint = new THREE.MeshStandardMaterial({ color:0x33373f, roughness:0.45, metalness:0.5 });
var matVisor = new THREE.MeshStandardMaterial({ color:0x0d0f13, roughness:0.2, metalness:0.3 });
var matDesk = new THREE.MeshStandardMaterial({ color:0x3a3226, roughness:0.4, metalness:0.1 });
var matDeskLeg = new THREE.MeshStandardMaterial({ color:0x1d1f24, roughness:0.4, metalness:0.7 });
var matChair = new THREE.MeshStandardMaterial({ color:0x20242c, roughness:0.55, metalness:0.2 });
var matKeyboard = new THREE.MeshStandardMaterial({ color:0x14161b, roughness:0.5, metalness:0.3 });
var matPlantPot = new THREE.MeshStandardMaterial({ color:0x3d3a34, roughness:0.7, metalness:0.1 });
var matLeaf = new THREE.MeshStandardMaterial({ color:0x3f7d4a, roughness:0.6, metalness:0.0 });
var matCup = new THREE.MeshStandardMaterial({ color:0xf5f1e8, roughness:0.3, metalness:0.05 });
var matCoffee = new THREE.MeshStandardMaterial({ color:0x3b2417, roughness:0.4, metalness:0.0 });
var matSpill = new THREE.MeshStandardMaterial({ color:0x2a1810, roughness:0.2, metalness:0.05, transparent:true, opacity:0.85 });
var matPlatformRim = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xffffff, emissiveIntensity:1.8, roughness:0.4 });

/* ---------- room ---------- */
var ROOM_W = 15, ROOM_D_BACK = 6.4, ROOM_H = 5.2;
var room = new THREE.Group();
scene.add(room);

var floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, 16), matFloor);
floor.rotation.x = -Math.PI/2; floor.position.set(0,0,3); floor.receiveShadow = true;
room.add(floor);

var ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, 16), matCeil);
ceiling.rotation.x = Math.PI/2; ceiling.position.set(0, ROOM_H, 3);
room.add(ceiling);

var backWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_H), matWall);
backWall.position.set(0, ROOM_H/2, -ROOM_D_BACK); backWall.receiveShadow = true;
room.add(backWall);

var leftWall = new THREE.Mesh(new THREE.PlaneGeometry(16, ROOM_H), matWallDark);
leftWall.rotation.y = Math.PI/2; leftWall.position.set(-ROOM_W/2, ROOM_H/2, 3); leftWall.receiveShadow = true;
room.add(leftWall);

var rightWall = new THREE.Mesh(new THREE.PlaneGeometry(16, ROOM_H), matWallDark);
rightWall.rotation.y = -Math.PI/2; rightWall.position.set(ROOM_W/2, ROOM_H/2, 3); rightWall.receiveShadow = true;
room.add(rightWall);

/* back wall: animated "org agents" dashboard, replacing what used to be the skyline window */
var dashTex = makeCanvasTexture(function(){}, 1024, 280); /* content painted by updateDashboard() each frame */
var dashMat = new THREE.MeshBasicMaterial({ map:dashTex.texture });
var windowMesh = new THREE.Mesh(new THREE.PlaneGeometry(12.96, 3.51), dashMat);
windowMesh.position.set(0, 2.85, -ROOM_D_BACK + 0.03);
room.add(windowMesh);
var winFrame = new THREE.Mesh(new THREE.PlaneGeometry(13.365, 3.915), new THREE.MeshStandardMaterial({color:0x0c0e12, roughness:0.6}));
winFrame.position.set(0, 2.85, -ROOM_D_BACK + 0.01);
room.add(winFrame);
var winGlow = new THREE.PointLight(0x59c8ff, 2.4, 9, 2);
winGlow.position.set(0, 3, -ROOM_D_BACK + 1.6);
room.add(winGlow);

/* single source of truth for agent status counts — used by the dashboard and the hologram hover tooltip */
function computeAgentCounts(){
  var active = robots.filter(function(r){ return r.mode==='workingmode' || r.mode==='idlemode'; }).length;
  var error  = robots.filter(function(r){ return r.mode==='errormode'; }).length;
  var sleep  = robots.filter(function(r){ return r.mode==='sleepingmode'; }).length;
  return { active:active, error:error, sleep:sleep, total:robots.length };
}

function drawDashboard(ctx, w, h, t){
  ctx.fillStyle = '#050a12';
  ctx.fillRect(0,0,w,h);

  /* faint tech grid */
  ctx.strokeStyle = 'rgba(90,150,190,0.08)'; ctx.lineWidth = 1;
  for (var gx=0; gx<w; gx+=32){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,h); ctx.stroke(); }
  for (var gy=0; gy<h; gy+=28){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); }

  /* slow scanline for a "live terminal" feel */
  var scanY = (t*46) % h;
  ctx.fillStyle = 'rgba(140,220,255,0.05)';
  ctx.fillRect(0, scanY, w, 3);

  /* title + live indicator */
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillStyle = '#8fe3ff'; ctx.font = 'bold 34px monospace';
  ctx.fillText('AGENTES', 26, 18);
  ctx.fillStyle = 'rgba(140,220,255,0.65)'; ctx.font = '13px monospace';
  ctx.fillText('MONITOR DE FORÇA DE TRABALHO AUTÔNOMA', 26, 58);
  var liveBlink = 0.5 + 0.5*Math.sin(t*4);
  ctx.fillStyle = 'rgba(120,255,160,' + (0.4+0.6*liveBlink).toFixed(2) + ')';
  ctx.beginPath(); ctx.arc(320, 30, 6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(140,255,180,0.85)'; ctx.font = '13px monospace';
  ctx.fillText('AO VIVO', 334, 24);

  /* uptime + active-agent count (top right) */
  var secs = Math.floor(t);
  var hh = String(Math.floor(secs/3600)).padStart(2,'0');
  var mm = String(Math.floor((secs%3600)/60)).padStart(2,'0');
  var ss = String(secs%60).padStart(2,'0');
  ctx.textAlign = 'right';
  ctx.fillStyle = '#cfeeff'; ctx.font = '15px monospace';
  ctx.fillText('TEMPO ATIVO  ' + hh+':'+mm+':'+ss, w-26, 22);
  var liveCounts = computeAgentCounts();
  ctx.fillStyle = '#8fe3ff';
  ctx.fillText('AGENTES ATIVOS  ' + liveCounts.active + '/' + robots.length, w-26, 46);
  ctx.textAlign = 'left';

  /* three separate pie charts — one per agent status, nothing else on the panel */
  var activeN = liveCounts.active;
  var errorN  = liveCounts.error;
  var sleepN  = liveCounts.sleep;
  var total   = Math.max(1, robots.length);
  var pieData = [
    { label:'ATIVOS',   n:activeN, color:'#7ee081' },
    { label:'ERRO',     n:errorN,  color:'#ff5c4d' },
    { label:'DORMINDO', n:sleepN,  color:'#8f9dff' }
  ];

  var areaTop=90, areaBottom=h-16, areaH=areaBottom-areaTop;
  var pieR = Math.min(areaH*0.4, 66);
  var colW = (w-52)/3;

  pieData.forEach(function(d,i){
    var cx = 26 + colW*i + colW/2;
    var cy = areaTop + areaH/2;
    var frac = d.n/total;

    ctx.beginPath(); ctx.arc(cx,cy,pieR,0,Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();

    if (d.n > 0){
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,pieR,-Math.PI/2,-Math.PI/2 + frac*Math.PI*2);
      ctx.closePath();
      ctx.fillStyle = d.color;
      ctx.fill();
    }

    ctx.beginPath(); ctx.arc(cx,cy,pieR*0.56,0,Math.PI*2);
    ctx.fillStyle = '#050a12'; ctx.fill();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#eaf6ff'; ctx.font = 'bold 28px monospace';
    ctx.fillText(String(d.n), cx, cy-16);
    ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(200,230,255,0.6)';
    ctx.fillText('/ ' + total, cx, cy+10);

    ctx.fillStyle = d.color; ctx.font = 'bold 15px monospace';
    ctx.fillText(d.label, cx, cy+pieR+18);
    ctx.textAlign = 'left';
  });
}

var matPrinterCart = new THREE.MeshStandardMaterial({ color:0x2a2d33, roughness:0.5, metalness:0.4 });

function buildPrinterStation(x, z, rotY){
  var g = new THREE.Group();

  /* --- cabinet the printer sits on --- */
  var cabW=0.64, cabH=0.86, cabD=0.5;
  var cabinet = new THREE.Mesh(new THREE.BoxGeometry(cabW,cabH,cabD), matPrinterCart);
  cabinet.position.set(0, cabH/2, 0); cabinet.castShadow = true; cabinet.receiveShadow = true;
  g.add(cabinet);
  var doorSeam = new THREE.Mesh(new THREE.BoxGeometry(0.012,cabH*0.72,0.012), matPrinterDark);
  doorSeam.position.set(0, cabH*0.5, cabD/2+0.006);
  g.add(doorSeam);
  [-0.11,0.11].forEach(function(hx){
    var handle = new THREE.Mesh(new THREE.BoxGeometry(0.018,0.12,0.022), matPrinterDark);
    handle.position.set(hx, cabH*0.48, cabD/2+0.02);
    g.add(handle);
  });
  [[-0.27,-0.21],[0.27,-0.21],[-0.27,0.21],[0.27,0.21]].forEach(function(p){
    var foot = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.03,8), matPrinterDark);
    foot.position.set(p[0], 0.015, p[1]);
    g.add(foot);
  });
  var topY = cabH;

  /* --- robust printer body --- */
  var pW=0.54, pH=0.32, pD=0.44;
  var bodyY = topY + pH/2;
  var body = new THREE.Mesh(new THREE.BoxGeometry(pW,pH,pD), matPrinterBody);
  body.position.y = bodyY; body.castShadow = true;
  g.add(body);
  var lid = new THREE.Mesh(new THREE.BoxGeometry(pW,0.05,pD), matPrinterDark);
  lid.position.y = bodyY + pH/2 + 0.025; lid.castShadow = true;
  g.add(lid);

  /* paper input drawer, bottom front */
  var drawer = new THREE.Mesh(new THREE.BoxGeometry(pW*0.72,0.09,0.03), matPrinterDark);
  drawer.position.set(0, topY+0.06, pD/2+0.012);
  g.add(drawer);
  var drawerHandle = new THREE.Mesh(new THREE.BoxGeometry(pW*0.4,0.015,0.015), matPrinterCart);
  drawerHandle.position.set(0, topY+0.06, pD/2+0.03);
  g.add(drawerHandle);

  /* control panel with a small screen + buttons */
  var panelY = bodyY + pH*0.22;
  var panel = new THREE.Mesh(new THREE.BoxGeometry(0.19,0.11,0.015), matPrinterDark);
  panel.position.set(-pW*0.2, panelY, pD/2+0.005);
  panel.rotation.x = -0.2;
  g.add(panel);
  var panelTex = makeCanvasTexture(function(ctx,w,h){
    ctx.fillStyle = '#07220f'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#63e08a'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.fillText('IMPRIMINDO...', w/2, h/2+7);
  }, 180,56);
  var panelMat = new THREE.MeshStandardMaterial({ map:panelTex.texture, emissiveMap:panelTex.texture, emissive:0xffffff, emissiveIntensity:0.85 });
  var panelScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.15,0.05), panelMat);
  panelScreen.position.set(-pW*0.2, panelY+0.017, pD/2+0.014);
  panelScreen.rotation.x = -0.2;
  g.add(panelScreen);
  for (var bi=0; bi<3; bi++){
    var btn = new THREE.Mesh(new THREE.CylinderGeometry(0.011,0.011,0.01,10), matPrinterCart);
    btn.rotation.x = Math.PI/2 - 0.2;
    btn.position.set(-pW*0.2 - 0.03 + bi*0.03, panelY-0.035, pD/2+0.012);
    g.add(btn);
  }

  /* output slot + sloped tray */
  var slotY = bodyY + pH*0.02;
  var slot = new THREE.Mesh(new THREE.BoxGeometry(pW*0.66,0.02,0.06), matPrinterDark);
  slot.position.set(0.05, slotY, pD/2-0.02);
  g.add(slot);
  var trayY = bodyY - pH*0.32;
  var tray = new THREE.Mesh(new THREE.BoxGeometry(pW*0.72,0.02,0.17), matPrinterDark);
  tray.position.set(0.05, trayY, pD/2+0.045);
  tray.rotation.x = -0.12;
  g.add(tray);

  /* a few already-printed sheets sitting in the tray */
  for (var s=0; s<4; s++){
    var stackSheet = new THREE.Mesh(new THREE.PlaneGeometry(0.34,0.21), matPaper);
    stackSheet.rotation.x = -Math.PI/2 - 0.12;
    stackSheet.position.set(0.05+(s%2?1:-1)*0.008, trayY+0.008+s*0.004, pD/2+0.06+(s%2?1:-1)*0.008);
    g.add(stackSheet);
  }

  var ledMat = new THREE.MeshStandardMaterial({ color:0x5cf28c, emissive:0x5cf28c, emissiveIntensity:1.2 });
  var led = new THREE.Mesh(new THREE.CircleGeometry(0.013,10), ledMat);
  led.position.set(pW*0.32, bodyY+pH*0.28, pD/2+0.008);
  g.add(led);

  /* vents on the side */
  for (var vi=0; vi<4; vi++){
    var vent = new THREE.Mesh(new THREE.BoxGeometry(0.012,0.16,0.012), matPrinterDark);
    vent.position.set(-pW/2-0.006, bodyY, -pD*0.3+vi*0.14);
    g.add(vent);
  }

  /* the sheet currently being printed — animated in the main loop via updatePrinter() */
  var sheet = new THREE.Mesh(new THREE.PlaneGeometry(pW*0.62,0.22), matPaper);
  sheet.rotation.x = -Math.PI/2;
  sheet.position.set(0.05, slotY+0.001, pD/2-0.02);
  sheet.scale.y = 0.05;
  g.add(sheet);

  g.position.set(x, 0, z);
  if (rotY) g.rotation.y = rotY;
  room.add(g);

  return { sheet:sheet, sheetSlotY:slotY+0.001, sheetTrayY:trayY+0.012, led:ledMat };
}

var matShredBody = new THREE.MeshStandardMaterial({ color:0x24262b, roughness:0.45, metalness:0.25 });
var matShredBin = new THREE.MeshStandardMaterial({ color:0x30343c, roughness:0.3, metalness:0.1, transparent:true, opacity:0.5 });
var matShredStrip = new THREE.MeshStandardMaterial({ color:0xe9e6df, roughness:0.8, side:THREE.DoubleSide });

function buildShredder(x, z, rotY){
  var g = new THREE.Group();
  var binW=0.36, binH=0.42, binD=0.3;

  var bin = new THREE.Mesh(new THREE.BoxGeometry(binW,binH,binD), matShredBin);
  bin.position.y = binH/2; bin.castShadow = true; bin.receiveShadow = true;
  g.add(bin);

  /* pile of already-shredded strips sitting at the bottom of the bin */
  for (var i=0; i<16; i++){
    var strip = new THREE.Mesh(new THREE.BoxGeometry(0.02+Math.random()*0.025, 0.01, 0.1+Math.random()*0.09), matShredStrip);
    strip.position.set((Math.random()-0.5)*binW*0.65, 0.015+Math.random()*0.05, (Math.random()-0.5)*binD*0.65);
    strip.rotation.y = Math.random()*Math.PI;
    g.add(strip);
  }

  var topH = 0.09;
  var topUnit = new THREE.Mesh(new THREE.BoxGeometry(binW+0.02,topH,binD+0.02), matShredBody);
  topUnit.position.y = binH + topH/2; topUnit.castShadow = true;
  g.add(topUnit);

  var slotY = binH + topH*0.5;
  var slot = new THREE.Mesh(new THREE.BoxGeometry(binW*0.55,0.014,0.03), matPrinterDark);
  slot.position.set(0, slotY+0.03, binD/2-0.03);
  g.add(slot);

  var ledMat = new THREE.MeshStandardMaterial({ color:0xff5c4d, emissive:0xff5c4d, emissiveIntensity:0.5 });
  var led = new THREE.Mesh(new THREE.CircleGeometry(0.011,10), ledMat);
  led.position.set(binW*0.32, binH+topH*0.5, binD/2+0.011);
  g.add(led);

  /* the sheet currently being fed in — animated in the main loop via updateShredder() */
  var feedStartY = binH + topH + 0.16;
  var sheet = new THREE.Mesh(new THREE.PlaneGeometry(0.22,0.3), matPaper);
  sheet.position.set(0, feedStartY, binD/2-0.02);
  g.add(sheet);

  g.position.set(x, 0, z);
  if (rotY) g.rotation.y = rotY;
  room.add(g);

  return { sheet:sheet, topUnit:topUnit, led:ledMat, feedStartY:feedStartY, slotY:slotY+0.03 };
}

function hojeISO(){
  var d = new Date();
  var tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10); // YYYY-MM-DD local
}

function statusParaModo(status, agora){
  var s = (status || "").toLowerCase().trim();
  if (s === "enviado") return "workingmode";
  if (s === "pendente") return "sleepingmode";
  // sem dado hoje: depois das 11h vira error, antes das 11h fica idle (parado, aguardando)
  return agora.getHours() >= 11 ? "errormode" : "idlemode";
}

async function buscarStatus(cfg){
  if (!cfg || !cfg.url || !cfg.anonKey) return null; // ligação ainda incompleta: pula sem dar erro
  try {
    var client = window.supabase.createClient(cfg.url, cfg.anonKey);
    var resp = await client
      .from(cfg.tabela)
      .select(cfg.colunaStatus)
      .eq(cfg.colunaData, hojeISO())
      .maybeSingle();
    if (resp.error){ console.error("Erro Supabase:", resp.error); return null; }
    return resp.data ? resp.data[cfg.colunaStatus] : null;
  } catch(e){ console.error("Erro ao buscar status:", e); return null; }
}

async function atualizarModosDosRobos(){
  var agora = new Date();
  
  for (var i = 0; i < robots.length; i++){

    // VIGENCIA SEMPRE TRABALHANDO - nao tem banco
    if (i === 3) {
      robots[i].mode = "workingmode";
      continue;
    }
    
    var status = await buscarStatus(ROBOS[i]);
    robots[i].mode = statusParaModo(status, agora);
    robots[i].statusRaw = status; // guarda exatamente o que veio de colunaStatus
  }
}

   Reuses the same mouse-NDC tracking as the hologram hover above. Cursor turns
   into a pointer while hovering a robot with a link, as a click affordance. */
function updateRobotHoverCursor(){
  holoRaycaster.setFromCamera(holoMouseNDC, camera);
  var hit = holoRaycaster.intersectObjects(robotClickTargets, false);
  canvas.style.cursor = (hit.length > 0 && robots[hit[0].object.userData.robotIndex].link) ? 'pointer' : '';
}

canvas.addEventListener('click', function(e){
  var rect = canvas.getBoundingClientRect();
  var ndc = new THREE.Vector2(
    ((e.clientX-rect.left)/rect.width)*2 - 1,
    -((e.clientY-rect.top)/rect.height)*2 + 1
  );
  holoRaycaster.setFromCamera(ndc, camera);
  var hit = holoRaycaster.intersectObjects(robotClickTargets, false);
  if (hit.length === 0) return;
  var robot = robots[hit[0].object.userData.robotIndex];
  if (robot && robot.link) window.open(robot.link, '_blank', 'noopener');
});

/* ---------- fixed supervisor overview camera ---------- */
/* Keeps all 4 desks in frame at once, like a manager watching the room.
   Adaptive FOV recalculates on resize so the row of robots always fits,
   and a very small idle sway keeps the shot from feeling like a static photo. */
function updateFov(){
  var aspect = window.innerWidth/window.innerHeight;
  var dist = CAM_BASE_POS[2] - 2.2;      /* distance to the nearest desk row (monitors now face us) */
  var halfX = 5.1;                        /* half-width to cover (desks + robots + margin) */
  var hHalf = Math.atan(halfX/dist);
  var vHalf = Math.atan(Math.tan(hHalf)/aspect);
  var neededFov = (vHalf * 180/Math.PI) * 2;
  camera.fov = Math.min(74, Math.max(46, neededFov+5));
  camera.updateProjectionMatrix();
}
updateFov();

function updateCamera(t){
  var pos = [
    CAM_BASE_POS[0] + Math.sin(t*0.12)*0.14,
    CAM_BASE_POS[1] + Math.sin(t*0.09)*0.07,
    CAM_BASE_POS[2] + Math.cos(t*0.1)*0.08
  ];
  var look = [
    CAM_BASE_LOOK[0] + Math.sin(t*0.07)*0.12,
    CAM_BASE_LOOK[1] + Math.cos(t*0.08)*0.03,
    CAM_BASE_LOOK[2]
  ];
  camera.position.set(pos[0],pos[1],pos[2]);
  camera.lookAt(look[0],look[1],look[2]);
}

/* ---------- animation loop ---------- */
var clock = new THREE.Clock();
var frame = 0;
var __drinkHeadWorld = new THREE.Vector3();
var __drinkLocalTarget = new THREE.Vector3();
var __drinkHandTarget = new THREE.Vector3();
var __drinkShoulderWorld = new THREE.Vector3();
var __drinkToTarget = new THREE.Vector3();
var __drinkV2 = new THREE.Vector3();
var __drinkHandLocal = new THREE.Vector3();
var __drinkRestQuat = new THREE.Quaternion();
var __drinkAimQuat = new THREE.Quaternion();
var __xAxis = new THREE.Vector3(1,0,0);
var __zzzHeadWorld = new THREE.Vector3();
var __nameTagHeadWorld = new THREE.Vector3();

/* simple analytic 2-bone arm IK so the hand actually arrives at the cup, then at the mouth */
var IK_L1 = 0.24;
var IK_V2_0 = new THREE.Vector3(0, -0.17, 0.23);
var IK_L2 = IK_V2_0.length();
var IK_V1_DIR = new THREE.Vector3(0, -1, 0);
var IK_BASE_ANGLE = Math.acos( IK_V1_DIR.dot(IK_V2_0.clone().normalize()) );
var IK_MAX = IK_L1 + IK_L2, IK_MIN = Math.abs(IK_L1 - IK_L2);

/* aims one shoulder+elbow so the hand lands exactly on targetWorld (full snap, no blending) */
function ikAimArmAt(shoulderGroup, targetWorld){
  shoulderGroup.getWorldPosition(__drinkShoulderWorld);
  __drinkToTarget.copy(targetWorld).sub(__drinkShoulderWorld);
  var D = THREE.MathUtils.clamp(__drinkToTarget.length(), IK_MIN, IK_MAX);
  __drinkToTarget.normalize();

  var cosAngle = THREE.MathUtils.clamp((D*D - IK_L1*IK_L1 - IK_L2*IK_L2) / (2*IK_L1*IK_L2), -1, 1);
  var delta = IK_BASE_ANGLE - Math.acos(cosAngle);
  shoulderGroup.elbowGroup.rotation.x = delta;

  __drinkV2.copy(IK_V2_0).applyAxisAngle(__xAxis, delta);
  __drinkHandLocal.copy(IK_V1_DIR).multiplyScalar(IK_L1).add(__drinkV2).normalize();
  __drinkAimQuat.setFromUnitVectors(__drinkHandLocal, __drinkToTarget);
  shoulderGroup.quaternion.copy(__drinkAimQuat);
}

/* coffee-sip timeline: reach for the cup -> lift it with the cup -> hold -> lower together -> release */
var DRINK_DURATION = 3.1;
var DRINK_T1 = 0.177, DRINK_T2 = 0.387, DRINK_T3 = 0.613, DRINK_T4 = 0.823;
function smoothstep01(x){ x = x<0?0:(x>1?1:x); return x*x*(3-2*x); }
function drinkPhaseAmounts(dp){
  if (dp < DRINK_T1) return { reach: smoothstep01(dp/DRINK_T1), lift: 0 };
  if (dp < DRINK_T2) return { reach: 1, lift: smoothstep01((dp-DRINK_T1)/(DRINK_T2-DRINK_T1)) };
  if (dp < DRINK_T3) return { reach: 1, lift: 1 };
  if (dp < DRINK_T4) return { reach: 1, lift: 1 - smoothstep01((dp-DRINK_T3)/(DRINK_T4-DRINK_T3)) };
  return { reach: 1 - smoothstep01((dp-DRINK_T4)/(1-DRINK_T4)), lift: 0 };
}

/* printer station: a sheet keeps emerging from the slot, sliding out and dropping onto the tray, looping */
var PRINT_DURATION = 2.4;
function updatePrinter(t){
  var p = printerStation;
  var cyc = (t % PRINT_DURATION) / PRINT_DURATION;
  var emerge = smoothstep01(cyc / 0.35);
  var slide = smoothstep01((cyc - 0.35) / 0.65);
  p.sheet.scale.y = 0.05 + 0.95 * emerge;
  p.sheet.position.z = THREE.MathUtils.lerp(0.2, 0.265, slide);
  p.sheet.position.y = THREE.MathUtils.lerp(p.sheetSlotY, p.sheetTrayY, slide);
  p.led.emissiveIntensity = 0.6 + Math.sin(t*6)*0.5*(1 - slide*0.5);
}

/* paper shredder: a sheet feeds down into the slot, then shrinks away as it's "shredded", looping.
   The unit jitters and its LED glows brighter while a sheet is actively being consumed. */
var SHRED_DURATION = 2.0;
function updateShredder(t){
  var s = shredderUnit;
  var cyc = (t % SHRED_DURATION) / SHRED_DURATION;
  var feed = smoothstep01(cyc / 0.55);
  var consume = smoothstep01((cyc - 0.55) / 0.45);
  s.sheet.position.y = THREE.MathUtils.lerp(s.feedStartY, s.slotY, feed);
  s.sheet.scale.y = 1 - 0.95 * consume;
  var jitter = consume * (1 - consume) * 4; /* peaks mid-shred */
  s.topUnit.position.x = Math.sin(t*45) * 0.0025 * jitter;
  s.led.emissiveIntensity = 0.5 + jitter * (0.6 + 0.4*Math.sin(t*24));
}

/* ---------- robot behavior modes ----------
   Each mode is a function(r, t): r is the robot object, t is the elapsed clock time.
   It's responsible for posing that one robot for the current frame.
   To add a new mode: write a function here, then list it in ROBOT_MODE_HANDLERS below.
   To use it: set the matching robo1..robo6 variable (near `positions`) to its name. */

var LAMP_COLOR_NORMAL = 0xffb268, LAMP_COLOR_ALERT = 0xff1111;
var LED_COLOR_NORMAL = 0xffffff, LED_COLOR_ALERT = 0xff1111, LED_COLOR_SLEEP = 0x080a0e;

function modeWorking(r, t){
  var ph = r.phase;
  r.zzz.visible = false;
  r.lamp.visible = true;
  r.lamp.color.setHex(LAMP_COLOR_NORMAL);
  r.ledMat.color.setHex(LED_COLOR_NORMAL);
  r.ledMat.emissive.setHex(LED_COLOR_NORMAL);
  r.deskStain.visible = false;
  r.deskDrip.visible = false;
  r.floorPuddle.visible = false;

  /* occasional, gentle, staggered coffee break: arm reaches the cup first, then lifts it, holds, lowers, releases */
  if (!r.drinking && t >= r.nextDrink){ r.drinking = true; r.drinkStart = t; }
  var reachAmt = 0, liftAmt = 0;
  if (r.drinking){
    var dp = (t - r.drinkStart) / DRINK_DURATION;
    if (dp >= 1){
      r.drinking = false;
      r.nextDrink = t + 16 + Math.random()*18; /* spaced out, different per robot */
    } else {
      var amt = drinkPhaseAmounts(dp);
      reachAmt = amt.reach; liftAmt = amt.lift;
    }
  }
  r.drinkT = liftAmt;

  r.hips.position.y = 0.85 + Math.sin(t*1.1+ph)*0.012;
  r.hips.position.x = r.reachLean.x * reachAmt;
  r.hips.position.z = r.reachLean.z * reachAmt;

  var typeCycle = Math.sin(t*3.4+ph)*0.16 + Math.sin(t*7.1+ph*1.3)*0.05;
  r.armL.rotation.x = -0.55 + typeCycle;
  r.armR.rotation.x = -0.55 - typeCycle*0.8;
  r.armL.rotation.z = 0;
  r.armR.rotation.z = 0;
  r.armL.elbowGroup.rotation.x = 0;
  r.armR.elbowGroup.rotation.x = 0;
  var yaw = Math.sin(t*0.16+ph)*0.28 + Math.sin(t*0.05+ph*2)*0.12;
  var pitch = -0.08 + Math.sin(t*0.9+ph)*0.02;
  r.headPivot.rotation.y = yaw;
  r.headPivot.rotation.x = pitch;
  r.chestLight.material.emissiveIntensity = 0.85 + Math.sin(t*2.2+ph)*0.4;

  if (reachAmt > 0.001){
    r.headPivot.rotation.x += 0.16 * liftAmt;
    r.headPivot.rotation.y *= (1 - 0.6*liftAmt);

    /* target the hand travels to: resting on the cup, then blending up toward the mouth */
    r.headPivot.getWorldPosition(__drinkHeadWorld);
    __drinkHeadWorld.y -= 0.05;
    __drinkHeadWorld.z += 0.09;
    __drinkHeadWorld.x += r.drinkSide * 0.04;
    __drinkHandTarget.copy(r.cupWorldRest).lerp(__drinkHeadWorld, liftAmt);

    /* 2-bone IK: solve elbow bend for distance, then aim the shoulder so the hand lands exactly on target */
    r.drinkArm.getWorldPosition(__drinkShoulderWorld);
    __drinkToTarget.copy(__drinkHandTarget).sub(__drinkShoulderWorld);
    var D = THREE.MathUtils.clamp(__drinkToTarget.length(), IK_MIN, IK_MAX);
    __drinkToTarget.normalize();

    var cosAngle = THREE.MathUtils.clamp((D*D - IK_L1*IK_L1 - IK_L2*IK_L2) / (2*IK_L1*IK_L2), -1, 1);
    var neededAngle = Math.acos(cosAngle);
    var delta = IK_BASE_ANGLE - neededAngle;
    r.drinkElbow.rotation.x = delta * reachAmt;

    __drinkV2.copy(IK_V2_0).applyAxisAngle(__xAxis, delta);
    __drinkHandLocal.copy(IK_V1_DIR).multiplyScalar(IK_L1).add(__drinkV2).normalize();

    __drinkRestQuat.copy(r.drinkArm.quaternion);
    __drinkAimQuat.setFromUnitVectors(__drinkHandLocal, __drinkToTarget);
    r.drinkArm.quaternion.copy(__drinkRestQuat).slerp(__drinkAimQuat, reachAmt);

    /* the cup rides exactly where the hand is heading */
    r.deskGroup.worldToLocal(__drinkLocalTarget.copy(__drinkHandTarget));
    r.cup.position.lerpVectors(r.cupBasePos, __drinkLocalTarget, liftAmt);
    r.cup.rotation.z = r.cupBaseRot.z - r.drinkSide * 0.6 * liftAmt;
    r.cup.rotation.x = r.cupBaseRot.x - 0.45 * liftAmt;
  } else {
    r.cup.position.copy(r.cupBasePos);
    r.cup.rotation.z = r.cupBaseRot.z;
    r.cup.rotation.x = r.cupBaseRot.x;
  }
}

function modeIdle(r, t){
  /* idle: sitting still at the desk, no typing, no coffee — just a faint breathing bob */
  var ph = r.phase;
  r.zzz.visible = false;
  r.lamp.visible = true;
  r.lamp.color.setHex(LAMP_COLOR_NORMAL);
  r.ledMat.color.setHex(LED_COLOR_NORMAL);
  r.ledMat.emissive.setHex(LED_COLOR_NORMAL);
  r.deskStain.visible = false;
  r.deskDrip.visible = false;
  r.floorPuddle.visible = false;
  r.hips.position.y = 0.85 + Math.sin(t*0.7+ph)*0.008;
  r.hips.position.x = 0;
  r.hips.position.z = 0;
  r.armL.rotation.set(-0.55, 0, 0);
  r.armR.rotation.set(-0.55, 0, 0);
  r.armL.elbowGroup.rotation.x = 0;
  r.armR.elbowGroup.rotation.x = 0;
  r.headPivot.rotation.set(-0.08, 0, 0);
  r.chestLight.material.emissiveIntensity = 0.85 + Math.sin(t*1.1+ph)*0.15;
  r.cup.position.copy(r.cupBasePos);
  r.cup.rotation.copy(r.cupBaseRot);
}

/* glowing floor ring beneath the hologram + accent baseboard strips */
function addFloorRing(x,z,r,color){
  var ring = new THREE.Mesh(new THREE.RingGeometry(r-0.03,r,40), new THREE.MeshStandardMaterial({ color:color, emissive:color, emissiveIntensity:1.0, side:THREE.DoubleSide, transparent:true, opacity:0.8 }));
  ring.rotation.x = -Math.PI/2; ring.position.set(x,0.015,z);
  room.add(ring);
}
addFloorRing(0,-0.45,0.55,0x59d6ff);
addFloorRing(0,-0.45,1,0x59d6ff);

function modeSleeping(r, t){
  /* asleep: bowed forward at the hips until the head rests on the desk, plus a "zzz" drifting up */
  var ph = r.phase;
  r.lamp.visible = false;
  r.lamp.color.setHex(LAMP_COLOR_NORMAL);
  r.ledMat.color.setHex(LED_COLOR_SLEEP);
  r.ledMat.emissive.setHex(LED_COLOR_SLEEP);
  r.deskStain.visible = false;
  r.deskDrip.visible = false;
  r.floorPuddle.visible = false;
  var BOW = 1.42; /* radians — forward bow so the head reaches desk height */

  r.hips.rotation.x = BOW + Math.sin(t*0.5+ph)*0.012; /* tiny breathing sway */
  r.hips.position.y = 0.82 + Math.sin(t*0.5+ph)*0.005;
  r.hips.position.x = 0;
  r.hips.position.z = -0.2; /* the forward bow alone overshoots past the monitor; pull back so the head lands in the open desk space */

  r.armL.rotation.set(0,0,0);
  r.armR.rotation.set(0,0,0);
  r.armL.elbowGroup.rotation.x = 0;
  r.armR.elbowGroup.rotation.x = 0;
  r.headPivot.rotation.set(0,0,0);

  r.chestLight.material.emissiveIntensity = 0.25 + Math.sin(t*0.5+ph)*0.08; /* dim, slow pulse: power-save look */

  r.cup.position.copy(r.cupBasePos);
  r.cup.rotation.copy(r.cupBaseRot);

  /* zzz: loops upward from the head, fading in then out, resetting to start over */
  r.headPivot.getWorldPosition(__zzzHeadWorld);
  var cyc = (t*0.35 + ph*0.27) % 1;
  var rise = cyc * 1.2;
  var fade = Math.sin(cyc * Math.PI);
  r.zzz.visible = true;
  r.zzz.position.set(
    __zzzHeadWorld.x - r.group.position.x + 0.15,
    __zzzHeadWorld.y - r.group.position.y + 0.1 + rise,
    __zzzHeadWorld.z - r.group.position.z
  );
  r.zzz.material.opacity = 0.9 * fade;
  var s = 0.26 + cyc*0.14;
  r.zzz.scale.set(s, s, 1);
}

function modeError(r, t){
  /* malfunctioning: both hands clamped to the head, jittery/glitchy movement,
     red-alert lamp + floor LED, and the coffee cup knocked over with coffee
     spilled on the desk and floor */
  var ph = r.phase;
  r.zzz.visible = false;
  r.lamp.visible = true;
  r.lamp.color.setHex(LAMP_COLOR_ALERT);
  r.ledMat.color.setHex(LED_COLOR_ALERT);
  r.ledMat.emissive.setHex(LED_COLOR_ALERT);

  r.hips.rotation.x = 0;
  r.hips.position.y = 0.85 + Math.sin(t*9+ph)*0.01 + Math.sin(t*23+ph*1.7)*0.005;
  r.hips.position.x = Math.sin(t*13+ph)*0.012;
  r.hips.position.z = 0;

  /* both hands clamp onto the sides of the head, shaking — same 2-bone IK as the coffee
     reach, aimed at a point on the head instead of the cup, so the hands actually land there */
  r.headPivot.getWorldPosition(__drinkHeadWorld);
  __drinkHeadWorld.x += 0.15 + Math.sin(t*22+ph)*0.015;
  __drinkHeadWorld.y += 0.02 + Math.sin(t*17+ph)*0.01;
  __drinkHeadWorld.z += 0.06;
  ikAimArmAt(r.armR, __drinkHeadWorld);

  r.headPivot.getWorldPosition(__drinkHeadWorld);
  __drinkHeadWorld.x -= 0.15 + Math.sin(t*20+ph+1.3)*0.015;
  __drinkHeadWorld.y += 0.02 + Math.sin(t*15+ph+0.7)*0.01;
  __drinkHeadWorld.z += 0.06;
  ikAimArmAt(r.armL, __drinkHeadWorld);

  /* glitchy, shaky head */
  r.headPivot.rotation.y = Math.sin(t*15+ph)*0.35 + Math.sin(t*37+ph)*0.12;
  r.headPivot.rotation.x = -0.05 + Math.sin(t*18+ph)*0.15;

  /* flickering warning pulse instead of the calm idle glow */
  r.chestLight.material.color.set(0xff2222);
  r.chestLight.material.emissive.set(0xff0000);
  r.chestLight.material.emissiveIntensity = Math.random() > 0.35 ? 1.3 : 0.2;

  /* the cup toppled over, coffee spilled across the desk and dripping onto the floor */
  r.cup.position.set(r.cupBasePos.x + 0.05, 0.735, r.cupBasePos.z - 0.02);
  r.cup.rotation.set(0, 0, 1.65);
  r.deskStain.visible = true;
  r.deskDrip.visible = true;
  r.floorPuddle.visible = true;
}

var ROBOT_MODE_HANDLERS = {
  workingmode: modeWorking,
  idlemode: modeIdle,
  sleepingmode: modeSleeping,
  errormode: modeError
};

function animate(){
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();
  frame++;

  robots.forEach(function(r){
    var handler = ROBOT_MODE_HANDLERS[r.mode] || modeWorking;
    handler(r, t);

    /* keep the little name tag on the opposite side of the desk */
    r.headPivot.getWorldPosition(__nameTagHeadWorld);

    var sideOffset;

    if (r.mode === 'sleepingmode') {
      sideOffset = r.group.position.x < 0 ? 1 : -1;
    } else {
      sideOffset = r.group.position.x < 0 ? 0.9 : -0.9;
    }

    var heightOffset = r.mode === 'sleepingmode' ? 0.2 : -0.4;

    r.nameTag.position.set(
      __nameTagHeadWorld.x - r.group.position.x + sideOffset,
      __nameTagHeadWorld.y - r.group.position.y + heightOffset,
      __nameTagHeadWorld.z - r.group.position.z
    );
  });

  updatePrinter(t);
  updateShredder(t);

  if (frame % 4 === 0){
    updateDashboard(t);
  }

  if (frame % 20 === 0){
    desks.forEach(function(d,i){ d.redrawScreen(t, i*1.3); });
  }

  if (window.__dust){
    window.__dust.rotation.y = t*0.01;
  }

  updateCamera(t);
  updateHoloHover();
  updateRobotHoverCursor();
  renderer.render(scene, camera);
}

/* first paint */
updateCamera(0);
renderer.render(scene, camera);
var loadingEl = document.getElementById('loading');
var captionEl = document.getElementById('caption');
setTimeout(function(){
  loadingEl.style.opacity = '0';
  captionEl.style.opacity = '1';
  setTimeout(function(){ loadingEl.style.display='none'; }, 850);
}, 420);
animate();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  updateFov();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
})();
</script>
